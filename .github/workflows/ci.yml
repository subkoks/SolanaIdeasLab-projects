name: CI

on:
  push:
    branches:
      - main
      - 'dependabot/**'
  pull_request:
    # Dependency-update branches (e.g. dependabot/**) now also validate on
    # push, since GitHub does not re-run the pull_request workflow when a
    # Dependabot branch is pushed to directly. This keeps verify checks
    # current without a manual "Re-run all jobs".

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Ephemeral PostgreSQL service used only by jobs that need real database
# coverage. Credentials here are GitHub Actions service-container defaults and
# never touch production, CI secrets, or repository settings. Each matrix job
# gets its own container instance, so the default database name is sufficient
# for cross-job isolation (no shared state between jobs).
services:
  postgres:
    image: postgres:16-alpine
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
    options: >-
      --health-cmd "pg_isready -U postgres"
      --health-interval 10s
      --health-timeout 5s
      --health-retries 5

jobs:
  verify:
    name: verify (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [token-safety-bot, token-sniper-bot, wallet-tracker-pro]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: |
          if [ -f prisma/schema.prisma ]; then
            npm run db:generate
          else
            echo "No prisma/schema.prisma in ${{ matrix.project }} — skipping Prisma generate"
          fi

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test (default — JSON/fallback and unit)
        run: npm test

      # Real-database coverage for packages that have DATABASE_URL-gated
      # Prisma suites. Skipped for token-sniper-bot (no DB-gated suites).
      # DATABASE_URL is set ONLY in this step's env, so the default `npm test`
      # step above keeps exercising the JSON/fallback path untouched. We run
      # the explicit DB test files (not a name filter) so the JSON-fallback
      # HTTP suite is never loaded while a live DATABASE_URL is in scope.
      - name: Test (PostgreSQL — claim/P2002/stale-claim suites)
        if: matrix.project != 'token-sniper-bot'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
        run: |
          # Apply this package's prisma migrations to the service container.
          npx prisma migrate deploy
          # Run only the DATABASE_URL-gated Prisma suites (explicit files so
          # the JSON-fallback HTTP suite is never loaded under DATABASE_URL).
          DB_FILES=()
          for f in tests/database-prisma.test.ts tests/database-analytics.test.ts tests/database-behavior.test.ts tests/database-breakdown.test.ts; do
            [ -f "$f" ] && DB_FILES+=("$f")
          done
          if [ ${#DB_FILES[@]} -gt 0 ]; then
            npx jest "${DB_FILES[@]}"
          else
            echo "No DATABASE_URL-gated test files in ${{ matrix.project }}"
          fi
