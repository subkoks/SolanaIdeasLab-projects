name: auto-merge

# Reconciles GitHub auto-merge on same-repo PRs so it is enabled only while the
# owner's explicit approval label and exact current-head marker are both present.
# This workflow never submits reviews or checks out PR code; it only calls the API.
# External forks are skipped, so untrusted code never runs with the write token.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}

# Explicit opt-in: the owner adds automerge-approved and the PR body marker
# Automerge-approved-head: <full current head SHA>. A synchronized head, label
# removal, body edit, or draft transition that leaves the marker invalid revokes
# any existing server-side auto-merge request. Required checks/reviews still apply.

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only same-repo PRs targeting main; external forks are skipped.
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Reconcile auto-merge with current opt-in
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull request head is not a full lowercase commit SHA"
            exit 1
          fi

          marker="Automerge-approved-head: $PR_HEAD_SHA"
          read -r label_current marker_current ready_current < <(
            jq -r --arg marker "$marker" '
              [
                (.pull_request.labels | any(.name == "automerge-approved")),
                ((.pull_request.body // "") |
                  split("\n") |
                  map(gsub("\\s+$"; "")) |
                  any(. == $marker)),
                (.pull_request.draft == false)
              ] | map(tostring) | @tsv
            ' "$GITHUB_EVENT_PATH"
          )

          read -r pr_state auto_enabled < <(
            gh pr view "$PR_URL" \
              --json state,autoMergeRequest \
              --jq '[.state, (.autoMergeRequest != null)] | @tsv'
          )
          if [[ "$pr_state" != "OPEN" ]]; then
            exit 0
          fi

          if [[
            "$PR_ACTOR" == "$REPOSITORY_OWNER" &&
            "$label_current" == "true" &&
            "$marker_current" == "true" &&
            "$ready_current" == "true"
          ]]; then
            if [[ "$auto_enabled" != "true" ]]; then
              gh pr merge --auto --squash \
                --match-head-commit "$PR_HEAD_SHA" "$PR_URL"
            fi
          elif [[ "$auto_enabled" == "true" ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
