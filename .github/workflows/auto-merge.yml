name: auto-merge

# Enables GitHub auto-merge on same-repo PRs so they merge automatically once all
# required status checks pass (branch protection still gates — nothing merges on red).
# Safe by design: this workflow never checks out PR code (it only calls the API), and
# it skips PRs from external forks, so untrusted code never runs with the write token.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only same-repo branches (owner/collaborator PRs + Dependabot); external forks are skipped.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Approve same-repo PRs so the branch-protection "required review" gate is
      # satisfied and auto-merge can complete. We never approve external forks
      # (the job is scoped to head.repo == github.repository above), so untrusted
      # code is never approved with the write token. Idempotent: re-approval of
      # an already-approved PR is a no-op.
      - name: Approve PR
        run: gh pr review "$PR_URL" --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
